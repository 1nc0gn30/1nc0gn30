<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 160" width="100%" height="160">
  <defs>
    <!-- Plasma Aurora Mesh Gradients -->
    <radialGradient id="plasmaGlow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="plasmaGlow2" cx="80%" cy="70%" r="65%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.20" />
      <stop offset="45%" stop-color="#00ff9d" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="goldCore" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0" />
    </radialGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.4" />
    </pattern>

    <!-- Filter Glows -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="headGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .matrix-stream {
        font-family: ui-monospace, "SF Mono", "Fira Code", monospace;
        font-size: 11px;
        fill: #00ff9d;
        letter-spacing: 1px;
      }
      .col-fade-1 { animation: fall 3.2s linear infinite; }
      .col-fade-2 { animation: fall 4.6s linear infinite 0.7s; }
      .col-fade-3 { animation: fall 2.9s linear infinite 1.4s; }
      .col-fade-4 { animation: fall 5.1s linear infinite 0.3s; }
      .col-fade-5 { animation: fall 3.7s linear infinite 1.8s; }
      .col-fade-6 { animation: fall 4.2s linear infinite 0.9s; }
      .col-fade-7 { animation: fall 3.5s linear infinite 2.2s; }
      .col-fade-8 { animation: fall 4.8s linear infinite 1.1s; }

      @keyframes fall {
        0% { transform: translateY(-160px); opacity: 0; }
        15% { opacity: 0.85; }
        85% { opacity: 0.85; }
        100% { transform: translateY(180px); opacity: 0; }
      }

      @keyframes plasmaPulse {
        0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.7; }
        50% { transform: scale(1.08) translate(15px, -8px); opacity: 1; }
      }

      .plasma-bg {
        animation: plasmaPulse 12s ease-in-out infinite;
        transform-origin: center;
      }

      .ascii-title {
        font-family: ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas, "Fira Code", monospace;
        font-size: 13px;
        font-weight: 800;
        fill: #00ff9d;
        filter: url(#emeraldGlow);
        letter-spacing: 2px;
      }
      .ascii-subtitle {
        font-family: ui-monospace, "SF Mono", "Fira Code", monospace;
        font-size: 10px;
        font-weight: 700;
        fill: #00e5ff;
        letter-spacing: 4px;
        opacity: 0.92;
      }
      .ascii-border {
        fill: none;
        stroke: #00ff9d;
        stroke-opacity: 0.35;
        stroke-width: 1;
      }
      .bracket {
        fill: #ffd700;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        font-weight: 700;
      }
    </style>
  </defs>

  <!-- Deep Obsidian Canvas Frame -->
  <rect width="880" height="160" rx="12" fill="#04060a" stroke="rgba(0, 255, 157, 0.2)" stroke-width="1" />

  <!-- Animated Plasma Aurora Underlay -->
  <g class="plasma-bg">
    <circle cx="220" cy="80" r="160" fill="url(#plasmaGlow1)" />
    <circle cx="660" cy="80" r="180" fill="url(#plasmaGlow2)" />
    <ellipse cx="440" cy="80" rx="200" ry="70" fill="url(#goldCore)" />
  </g>

  <!-- Matrix Falling Rain Streams (Background Layer) -->
  <g opacity="0.38">
    <!-- Stream 1 -->
    <text x="35" y="0" class="matrix-stream col-fade-1">
      <tspan x="35" dy="14">0</tspan><tspan x="35" dy="13">1</tspan><tspan x="35" dy="13">🜂</tspan><tspan x="35" dy="13">x</tspan><tspan x="35" dy="13">7</tspan><tspan x="35" dy="13">F</tspan><tspan x="35" dy="13" fill="#ffffff" filter="url(#headGlow)">█</tspan>
    </text>
    <!-- Stream 2 -->
    <text x="85" y="0" class="matrix-stream col-fade-2">
      <tspan x="85" dy="14">⏣</tspan><tspan x="85" dy="13">0</tspan><tspan x="85" dy="13">A</tspan><tspan x="85" dy="13">9</tspan><tspan x="85" dy="13">1</tspan><tspan x="85" dy="13">C</tspan><tspan x="85" dy="13" fill="#00e5ff" filter="url(#headGlow)">⌁</tspan>
    </text>
    <!-- Stream 3 -->
    <text x="140" y="0" class="matrix-stream col-fade-3">
      <tspan x="140" dy="14">1</tspan><tspan x="140" dy="13">0</tspan><tspan x="140" dy="13">E</tspan><tspan x="140" dy="13">🜄</tspan><tspan x="140" dy="13">4</tspan><tspan x="140" dy="13">8</tspan><tspan x="140" dy="13" fill="#ffffff">▒</tspan>
    </text>
    <!-- Stream 4 -->
    <text x="190" y="0" class="matrix-stream col-fade-4">
      <tspan x="190" dy="14">0</tspan><tspan x="190" dy="13">1</tspan><tspan x="190" dy="13">B</tspan><tspan x="190" dy="13">F</tspan><tspan x="190" dy="13">0</tspan><tspan x="190" dy="13">2</tspan><tspan x="190" dy="13" fill="#00ff9d" filter="url(#headGlow)">▓</tspan>
    </text>
    <!-- Stream 5 -->
    <text x="690" y="0" class="matrix-stream col-fade-5">
      <tspan x="690" dy="14">🜁</tspan><tspan x="690" dy="13">1</tspan><tspan x="690" dy="13">0</tspan><tspan x="690" dy="13">A</tspan><tspan x="690" dy="13">D</tspan><tspan x="690" dy="13">3</tspan><tspan x="690" dy="13" fill="#ffffff">█</tspan>
    </text>
    <!-- Stream 6 -->
    <text x="745" y="0" class="matrix-stream col-fade-6">
      <tspan x="745" dy="14">0</tspan><tspan x="745" dy="13">F</tspan><tspan x="745" dy="13">8</tspan><tspan x="745" dy="13">1</tspan><tspan x="745" dy="13">⏣</tspan><tspan x="745" dy="13">C</tspan><tspan x="745" dy="13" fill="#00e5ff" filter="url(#headGlow)">⌖</tspan>
    </text>
    <!-- Stream 7 -->
    <text x="795" y="0" class="matrix-stream col-fade-7">
      <tspan x="795" dy="14">1</tspan><tspan x="795" dy="13">1</tspan><tspan x="795" dy="13">0</tspan><tspan x="795" dy="13">7</tspan><tspan x="795" dy="13">🜃</tspan><tspan x="795" dy="13">E</tspan><tspan x="795" dy="13" fill="#ffffff">░</tspan>
    </text>
    <!-- Stream 8 -->
    <text x="845" y="0" class="matrix-stream col-fade-8">
      <tspan x="845" dy="14">0</tspan><tspan x="845" dy="13">x</tspan><tspan x="845" dy="13">9</tspan><tspan x="845" dy="13">A</tspan><tspan x="845" dy="13">1</tspan><tspan x="845" dy="13">5</tspan><tspan x="845" dy="13" fill="#00ff9d" filter="url(#headGlow)">█</tspan>
    </text>
  </g>

  <!-- Horizontal Grid Horizon / Ambient Cyber Wire -->
  <line x1="20" y1="135" x2="860" y2="135" stroke="#00ff9d" stroke-opacity="0.15" stroke-dasharray="8,6" />
  <line x1="20" y1="25" x2="860" y2="25" stroke="#00e5ff" stroke-opacity="0.12" stroke-dasharray="8,6" />

  <!-- Center Floating Glassmorphic Plate -->
  <rect x="180" y="24" width="520" height="112" rx="10" fill="#060913" fill-opacity="0.88" stroke="url(#emeraldGlow)" class="ascii-border" />

  <!-- Corner Brackets -->
  <text x="192" y="42" class="bracket">⌜</text>
  <text x="680" y="42" class="bracket">⌝</text>
  <text x="192" y="126" class="bracket">⌞</text>
  <text x="680" y="126" class="bracket">⌟</text>

  <!-- Center ASCII Art Typography -->
  <g text-anchor="middle">
    <!-- Row 1 of Block Monospace Logo -->
    <text x="440" y="58" class="ascii-title">█▄░█ █▀▀ ▄▀█ █░░   █▀▀ █▀█ ▄▀█ ▀█ █ █▀▀ █▀█</text>
    <!-- Row 2 of Block Monospace Logo -->
    <text x="440" y="77" class="ascii-title">█░▀█ ██▄ █▀█ █▄▄   █▀░ █▀▄ █▀█ █▄ █ ██▄ █▀▄</text>

    <!-- Divider Bar -->
    <line x1="260" y1="92" x2="620" y2="92" stroke="#00ff9d" stroke-opacity="0.3" stroke-width="1" />

    <!-- Subtitle Pill / Status -->
    <text x="440" y="112" class="ascii-subtitle">SOVEREIGN SYSTEMS • MULTI-AGENT INTELLIGENCE</text>
    <text x="440" y="125" font-family="ui-monospace, monospace" font-size="8.5" fill="#8892b0" letter-spacing="2px">
      LOCAL-FIRST • CRYPTOGRAPHIC PROVENANCE • ZERO TELEMETRY
    </text>
  </g>

  <!-- CRT Scanlines Overlay -->
  <rect width="880" height="160" rx="12" fill="url(#scanlines)" pointer-events="none" opacity="0.35" />
</svg>
